name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa SDK e NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Verifica configurazione release
        run: |
          grep -q "include 'arm64-v8a'" android/app/build.gradle
          grep -q "enableMinifyInReleaseBuilds=true" android/gradle.properties
          grep -q "enableShrinkResourcesInReleaseBuilds=true" android/gradle.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK release
        working-directory: android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --build-cache

      - name: Prepara e verifica APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk out/laila-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/laila-arm64-v8a.apk
          ls -lh out/laila-arm64-v8a.apk

      - name: Crea release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          TITLE="Laila APK #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          SHA256=$(sha256sum out/laila-arm64-v8a.apk | cut -d' ' -f1)
          NOTES=$(printf 'Build automatica da main.\n\nCommit: %s\nRun: %s\nABI: arm64-v8a\nSHA256: %s\nFirma: debug (solo sideload).' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SHA256")
          gh release create "$TAG" out/laila-arm64-v8a.apk \
            --title "$TITLE" --notes "$NOTES"

      - name: Mantieni solo le ultime 5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apk-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            if [ -n "$tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
