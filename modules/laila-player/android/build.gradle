plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lailaplayer'
version = '0.1.0'

def media3Version = '1.11.0'

android {
  namespace "expo.modules.lailaplayer"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Apache-2.0. Playback + MediaSession only: no cast, no HLS, no UI.
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
}
